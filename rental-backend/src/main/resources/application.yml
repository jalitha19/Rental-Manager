spring:
  application:
    name: rental-backend



  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rental_db}
    username: ${DB_USERNAME:rental_user}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations, not Hibernate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    # Must be overridden via env var in any real deployment
    secret: ${JWT_SECRET:CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_BEFORE_DEPLOYING}
    expiration-ms: ${JWT_EXPIRATION_MS:604800000}   # 7 days, since this is a single low-traffic personal user
  admin:
    # Used ONLY on first startup (empty users table) to create the one admin account.
    # Set these via env vars before first run, then log in and change the password.
    username: ${ADMIN_USERNAME:admin}
    initial-password: ${ADMIN_INITIAL_PASSWORD:changeme}

logging:
  level:
    com.rental: INFO
